apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-api.fullname" . }}-config
  labels:
    {{- include "devops-api.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.application.name | quote }}
  APP_ENV: {{ .Values.application.environment | quote }}
  APP_VERSION: {{ .Values.application.version | quote }}